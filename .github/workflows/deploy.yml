name: Full Stack Deploy

on:
  push:
    branches:
      - main

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region ${{ secrets.AWS_REGION }} \
          | docker login --username AWS --password-stdin ${{ secrets.ECR_REGISTRY }}

      - name: Build & Push Backend Image
        run: |
          docker build -t backend-app ./backend
          docker tag backend-app:latest ${{ secrets.ECR_REGISTRY }}/backend-app:latest
          docker push ${{ secrets.ECR_REGISTRY }}/backend-app:latest

      - name: Build & Push Frontend Image
        run: |
          docker build -t frontend-app ./client
          docker tag frontend-app:latest ${{ secrets.ECR_REGISTRY }}/frontend-app:latest
          docker push ${{ secrets.ECR_REGISTRY }}/frontend-app:latest

      - name: Build & Push MySQL Image
        run: |
          docker build -t mysql-db ./mysql
          docker tag mysql-db:latest ${{ secrets.ECR_REGISTRY }}/mysql-db:latest
          docker push ${{ secrets.ECR_REGISTRY }}/mysql-db:latest

      - name: Deploy on EC2
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_KEY }}
          script: |
            cd /home/ec2-user/app
            docker-compose down
            docker-compose pull
            docker-compose up -d

